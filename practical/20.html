<!-- 
Question 20: Initialize a Git repository, commit changes, and push to GitHub.
Deploy a personal portfolio site on GitHub Pages or Netlify.


1. Create a new project folder for portfolio.

2. Open terminal / Git Bash inside the folder.

3. Initialize git repository:
   git init

4. Add all project files:
   git add .

5. Commit the files:
   git commit -m "Portfolio website by Riya Rani"

6. Create a new repository on GitHub.

7. Connect local repository to GitHub:
   git remote add origin <repository-url>

8. Push code to GitHub:
   git branch -M main
   git push origin main

9. For GitHub Pages deployment:
   - Go to repository Settings
   - Click Pages
   - Select main branch
   - Save and get live link

10. Portfolio website successfully deployed.
-->
